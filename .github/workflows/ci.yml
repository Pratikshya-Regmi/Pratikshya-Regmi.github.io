name: Beautiful Jekyll CI
on: workflow_dispatch
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies
        run: bundle install && bundle exec appraisal install
      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5
      - name: Setup CI config
        run: |
          echo "---" > _config_ci.yml
          echo "baseurl: ${{ steps.configure-pages.outputs.base_path }}" >> _config_ci.yml
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --config _config_ci.yml,_config.yml
      - name: Use public-safe documents in recovery artifact
        run: |
          cp astro-site/public/assets/CV_PR.pdf _site/assets/CV_PR.pdf
          cp astro-site/public/assets/Pratikshya_Resume_oct025.pdf _site/assets/Pratikshya_Resume_oct025.pdf
      - name: Retain legacy build for manual recovery review
        uses: actions/upload-artifact@v4
        with:
          name: legacy-jekyll-review-only
          path: _site
